<!doctype html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <title>Venom | Shantel Christie, 2026</title>

  <style>
    body{
      margin: 0;
      background: black;
    }

    .hero{
      min-height: 100vh;
      background-image: url("vimage.JPG");
      background-size: cover;
      background-position: center;
      position: relative;
      color: white;
		z-index: 1;
    }

    .hero::before{
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
		z-index: 2;
    }

    @font-face{
      font-family:"venomfont";
      src: url("venomfont/wolfsbane23dital.ttf");
    }

    
    .hero-content{
      position: absolute;
      top: 23%;   
      left: 50%;
		transform: translate(-50%,-50%);
		text-align: center;
      z-index: 10;
   
    }

    h1{
      font-family: "venomfont";
      font-size: 100px;
      letter-spacing: 5px;
      color: red;
      margin: 0;
		position: relative;
		left: 5px;
    }

    p{
      font-family: "Cinzel", serif;
      font-size: 40px;
      margin: 10px 0 0;
    }
.trailer-section h2{
  margin-top: 0 0 20px;
}
   .site-header{
  position: relative;   
  margin: 40px auto 0; 
  z-index: 10;
  width: 800px;
} 
    
   

    .main-nav{
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px 0;
      background: rgba(0,0,0,0.45);
      border-top: 1px solid rgba(255,255,255,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.35);
    }

    .main-nav a{
      color: white;
      text-decoration: none;
      letter-spacing: 6px;
      font-size: 14px;
      padding: 6px 18px;
      position: relative;
    }

    .main-nav a:not(:last-child)::after{
      content: "";
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      height: 16px;
      width: 1px;
      background: rgba(255,255,255,0.35);
    }
.trailer-section{
  background: black;
  padding: 20px 0 80px;
  text-align: center;
  color: white;
	position: relative;
	  z-index: 1;
	  }
#trailer{
  scroll-margin-top: 140px;
}
.trailer-wrapper{
  position: relative;
  width: 80%;
  max-width: 900px;
  margin: 0 auto;
}


.trailer-wrapper::before{
  content: "";
  display: block;
  padding-top: 56.25%;
}

.trailer-wrapper iframe{
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  z-index: 5;
	border: none;
	display:block;
	
}
	  .cta-btn{
  display: inline-block;
  margin-top: 30px;
  padding: 14px 40px;
  border: 2px solid red;
  color: white;
  text-decoration: none;
  font-family: "Cinzel", serif;
  letter-spacing: 3px;
  font-size: 14px;
  transition: 0.3s ease;
}

.cta-btn:hover{
  background: red;
  color: black;
  box-shadow: 0 0 25px red;
}
	  .tagline{
  font-size: 18px;
  letter-spacing: 2px;
  margin-top: 20px;
  opacity: 0.8;
}
	  .movie-info{
  font-size: 14px;
  letter-spacing: 2px;
  opacity: 0.7;
  margin-top: 20px;
}
	  .hero-smoke{
  width: 260px;
  margin: 20px auto;
  display: block;
  opacity: 0.4;
  mix-blend-mode: screen;
  pointer-events: none;
}
    footer{
      height: 100px;
      background: black;
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" id="home">
      <header class="site-header">
        <nav class="main-nav">
          <a href="#home">HOME</a>
          <a href="#trailer">TRAILER</a>
          <a href="#cast">CAST</a>
          <a href="#about">ABOUT</a>
        </nav>
      </header>

      <div class="hero-content">
        <div class="title-wrap">
  <h1>VENOM</h1>
</div>
        <p>THE LAST DANCE</p>
      </div>
		<img src="smoke.mp4" class="hero-smoke">
</section>
	  <a href="#trailer" class="cta-btn">WATCH TRAILER</a>
	  <p class="tagline">A world on the edge. One final symbiote.</p>
	  <p class="movie-info">2026 • Action / Sci-Fi • 2h 10m</p>
    <section class="trailer-section" id="trailer">
    <h2>OFFICIAL TRAILER</h2>
    <div class="trailer-wrapper">
    <iframe
  src="https://www.youtube-nocookie.com/embed/STScKOUpXR8"
  title="Venom: The Last Dance | Official Trailer"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen>
</iframe>
    </div>
  </section>
  </main>
  <footer></footer>
</body>
</html>
