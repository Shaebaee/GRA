<!DOCTYPE html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <title>Venom | Shantel Christie, 2026</title>

  <style>
    body{
      margin:0;
      background:black;
    }

    
    .wrapper{
      width:1366px;
      margin:0 auto;
    }

    .hero{
      min-height:100vh;
      background-image:url("vimage.JPG");
      background-size:cover;
      background-position:center;
      position:relative;
      color:white;
      overflow:hidden;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.55);
      z-index:1;
    }

    @font-face{
      font-family:"venomfont";
      src:url("venomfont/wolfsbane23dital.ttf");
    }

    
    .site-header{
      position:relative;
      margin:40px auto 0;
      width:800px;
      z-index:5;
    }

    .main-nav{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:60px;
      padding:10px 0;
      background:rgba(0,0,0,0.45);
      border-top:1px solid rgba(255,255,255,0.35);
      border-bottom:1px solid rgba(255,255,255,0.35);
    }

    .main-nav a{
      color:white;
      text-decoration:none;
      letter-spacing:6px;
      font-size:14px;
      font-family:"Cinzel", serif;
    }

   
    .hero-content{
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      z-index:6;
      width:100%;
    }

    .hero-text{
      position:relative;
      z-index:7;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    h1{
      font-family:"venomfont";
      font-size:100px;
      letter-spacing:5px;
      color:red;
      margin:0;
    }

    p{
      font-family:"Cinzel", serif;
      font-size:40px;
      margin:10px 0 0;
    }

    
    .hero-smoke{
      position:absolute;
      top:50%;
      left:0;
      right:0;
      margin:0 auto;
      transform:translateY(-50%);
      width:1500px;
      opacity:0.50;
      z-index:2;
      pointer-events:none;
    }

    
    .trailer-cta{
      margin-top:40px;
      display:inline-block;
      padding:14px 36px;
      border:2px solid red;
      color:white;
      font-family:"Cinzel", serif;
      letter-spacing:3px;
      font-size:14px;
      text-align:center;
      text-decoration:none;
      transition:0.3s ease;
    }

    .trailer-cta:hover{
      background:red;
      color:black;
      box-shadow:0 0 25px red;
    }

    .down-arrows{
      margin-top:8px;
      font-size:14px;
      animation:bounce 1.5s infinite;
    }

    @keyframes bounce{
      0%{ transform:translateY(0); opacity:0.3; }
      50%{ transform:translateY(6px); opacity:1; }
      100%{ transform:translateY(0); opacity:0.3; }
    }
	  
    .trailer-section{
      background:black;
      padding:60px 0 100px;
      text-align:center;
      color:white;
    }

    .trailer-section h2{
      font-family:"Cinzel", serif;
      letter-spacing:4px;
      margin:0 0 30px;
    }

    .trailer-wrapper{
      position:relative;
      width:80%;
      max-width:900px;
      margin:0 auto;
    }

    .trailer-wrapper::before{
      content:"";
      display:block;
      padding-top:56.25%;
    }

    .trailer-wrapper iframe{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      border:0;
    }

    footer{
      height:100px;
      background:black;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <main>

      <section class="hero" id="home">

        
        <video class="hero-smoke" autoplay muted loop playsinline>
          <source src="smoke.mp4" type="video/mp4">
        </video>

        
        <header class="site-header">
          <nav class="main-nav">
            <a href="#home">HOME</a>
            <a href="#trailer">TRAILER</a>
            <a href="#cast">CAST</a>
            <a href="#about">ABOUT</a>
          </nav>
        </header>

        
        <div class="hero-content">
          <div class="hero-text">
            <h1>VENOM</h1>
            <p>THE LAST DANCE</p>

            <a href="#trailer" class="trailer-cta">
              WATCH TRAILER NOW
              <div class="down-arrows">▼ ▼ ▼</div>
            </a>
          </div>
        </div>

      </section>

      <section class="trailer-section" id="trailer">
        <h2>OFFICIAL TRAILER</h2>

        <div class="trailer-wrapper">
          <iframe
            src="https://www.youtube-nocookie.com/embed/STScKOUpXR8"
            title="Venom: The Last Dance | Official Trailer"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
      </section>

    </main>

    <footer></footer>
  </div>
</body>
</html>
