<!doctype html>
<html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&display=swap" rel="stylesheet">

  <meta charset="UTF-8">
  <title>Venom | Shantel Christie, 2026</title>

  <style>
    body{
      margin: 0;
      background: black;
    }

    .hero{
      min-height: 100vh;
      background-image: url("vimage.JPG");
      background-size: cover;
      background-position: center;
      position: relative;
      color: white;
		z-index: 1;
    }

    .hero::before{
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.55);
		z-index: 2;
    }

    @font-face{
      font-family:"venomfont";
      src: url("venomfont/wolfsbane23dital.ttf");
    }

    
    .hero-content{
      position: absolute;
      top: 23%;   
      left: 50%;
		transform: translate(-50%,-50%);
		text-align: center;
      z-index: 10;
   
    }

    h1{
      font-family: "venomfont";
      font-size: 100px;
      letter-spacing: 5px;
      color: red;
      margin: 0;
		position: relative;
		left: 40px;
    }

    p{
      font-family: "Cinzel", serif;
      font-size: 40px;
      margin: 10px 0 0;
    }

    
    .site-header{
      position: absolute;
      top: 310px; 
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      width: 900px;
    }

    .main-nav{
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 28px;
      background: rgba(0,0,0,0.45);
      border-top: 1px solid rgba(255,255,255,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.35);
    }

    .main-nav a{
      color: white;
      text-decoration: none;
      letter-spacing: 4px;
      font-size: 14px;
      padding: 6px 18px;
      position: relative;
    }

    .main-nav a:not(:last-child)::after{
      content: "";
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      height: 16px;
      width: 1px;
      background: rgba(255,255,255,0.35);
    }
.trailer-section{
  background: black;
  padding: 100px 0;
  text-align: center;
  color: white;
}

.trailer-wrapper{
  position: relative;
  width: 80%;
  max-width: 900px;
  margin: 0 auto;
}


.trailer-wrapper::before{
  content: "";
  display: block;
  padding-top: 56.25%;
}

.trailer-wrapper iframe{
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: 0;
  z-index: 5;
}
    footer{
      height: 100px;
      background: black;
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" id="home">
      <header class="site-header">
        <nav class="main-nav">
          <a href="#home">HOME</a>
          <a href="#trailer">TRAILER</a>
          <a href="#cast">CAST</a>
          <a href="#about">ABOUT</a>
        </nav>
      </header>

      <div class="hero-content">
        <div class="title-wrap">
  <h1>VENOM</h1>
</div>
        <p>THE LAST DANCE</p>
      </div>
</section>
	  
    <section class="trailer-section" id="trailer">
    <h2>OFFICIAL TRAILER</h2>
    <div class="trailer-wrapper">
    <iframe
  src="https://www.youtube-nocookie.com/embed/STScKOUpXR8"
  title="Venom: The Last Dance | Official Trailer"
  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
  allowfullscreen>
</iframe>
    </div>
  </section>
  </main>
  <footer></footer>
</body>
</html>
